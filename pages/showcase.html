    <div class="interactive-galery">
        <div class="interactive-galery-details">
            <div class="interactive-galery-options">
                <div class="interactive-galery-profile">
                    <img src="" id="profile-img" alt="profile picture">
                    <p id="interactive_author_name">Default Name</p>
                </div>
                <button id="close-gallery">X</button>
            </div>
            <div class="interactive-galery-edit-remove">
                <button id="edit">Edit</button>
                <button id="remove">Delete</button>
            </div>
            <img src="" alt="Image by creators" id="interactive_author_image">
            <div class="gallery-download">
                <button>
                    <img src="../assets/downloads.png" alt="download icon" width="20">
                   Download 
                </button>
            </div>
            
        </div>
    </div>
    <div class="edit-post">
        <form action="#" class="edit-post-details">
            <span id="edit-post-close">X</span>
            <label for="first_name">Author first name:</label>
            <input type="text" name="first_name" id="first_name">
            <label for="last_name">Author last name:</label>
            <input type="text" name="last_name" id="last_name">
            <label>Image preview</label>
            <img src="" alt="Image preview" width="200px" id="post-preview"/>
            <button>Save change</button>
        </form>
    </div>
    <div class="wrapper">
        <div class="wrapper home-gallery">
            <div class="d-grid gap-1 gap-2-lg d-md-block mb-5">
                <button type="button" class="btn btn-outline-dark px-5 py-3 me-2 mb-2" id="category">computer</button>
                <button type="button" class="btn btn-outline-dark px-5 py-3 me-2 mb-2" id="category">party</button>
                <button type="button" class="btn btn-outline-dark px-5 py-3 me-2 mb-2" id="category">backgrounds</button>
                <button type="button" class="btn btn-outline-dark px-5 py-3 me-2 mb-2" id="category">success</button>
                <button type="button" class="btn btn-outline-dark px-5 py-3 me-2 mb-2" id="category">person</button>
                <button type="button" class="btn btn-outline-dark px-5 py-3 me-2 mb-2" id="category">crowd</button>
            </div>
            <h2>Newest photography showcase</h2>
            <div class="options">
                <p>Photos <span>576.7K</span></p>
                <!-- Button trigger modal -->
                <button type="button" class="btn btn-dark upload-btn" id="upload" data-bs-toggle="modal" data-bs-target="#exampleModal">
                    Upload photo +
                </button>
                
                <!-- Modal -->
                <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                    <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Add photo</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div id="div1" ondrop="drop(event)" ondragover="allowDrop(event)">
                            </div>

                            <div class="d-grid gap-2 d-md-block my-2">
                                <p>Drag images into dashed section</p>
                                <img id="drag1" src="../images/pexels-willy-mendez-1669648805-29159338.jpg" draggable="true" ondragstart="drag(event)" width="100">
                                <img id="drag2" src="../images/pexels-ioanamtc-7521429.jpg" draggable="true" ondragstart="drag(event)" width="100">
                                <img id="drag3" src="../images/pexels-skylake-27915654.jpg" draggable="true" ondragstart="drag(event)" width="100">
                            </div>
                        </div>
                        <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary">Upload</button>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
            <div class="gallery">
            </div>
        </div>
    </div>
