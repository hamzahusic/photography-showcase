    <header>
        <div class="header-main">
            <div class="header-input">
                <h1>The best photography showcase shared by creators.</h1>
                <div class="search-bar">
                    <input type="text" placeholder="Search for photos">
                    <img src="./assets/search.png" alt="search icon" width="18">
                </div>
            </div>
        </div>
    </header>
    <div class="interactive-galery">
        <div class="interactive-galery-details">
            <div class="interactive-galery-options">
                <div class="interactive-galery-profile">
                    <img src="" id="profile-img" alt="profile picture">
                    <p id="interactive_author_name">Default Name</p>
                </div>
                <button id="close-gallery">X</button>
            </div>
            <div class="interactive-galery-edit-remove">
                <button id="edit">Edit</button>
                <button id="remove">Delete</button>
            </div>
            <img src="" alt="Image by creators" id="interactive_author_image">
            <div class="gallery-download">
                <button>
                    <img src="./assets/downloads.png" alt="download icon" width="20">
                   Download 
                </button>
            </div>
            
        </div>
    </div>
    <div class="edit-post">
            <form action="#" class="edit-post-details">
                <span id="edit-post-close">X</span>
                <label for="first_name">Author first name:</label>
                <input type="text" name="first_name" id="first_name">
                <label for="last_name">Author last name:</label>
                <input type="text" name="last_name" id="last_name">
                <label>Image preview</label>
                <img src="" alt="Image preview" width="200px" id="post-preview"/>
                <button>Save change</button>
            </form>
    </div>
    <section>
        <div class="filters">
            <a href="#">All</a>
            <a href="#" class="active-filter">Popular</a>
            <a href="#">Newest</a>
            <a href="#">Leaderboard</a>
        </div>
        <div class="wrapper home-gallery">
            <h2>Photos by creators</h2>
            <div class="gallery">
            </div>
        </div>
    </section>
